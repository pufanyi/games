name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
          cache: true

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno check

      - name: Test
        run: deno task test
