name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `version` input: the action reads it from the `$schema` URL in
      # biome.json, which must match the pin in deno.json.
      - uses: biomejs/setup-biome@v2

      - name: Check Biome version matches deno.json
        run: |
          expected=$(jq -r '.imports["@biomejs/biome"]' deno.json | sed 's|^npm:@biomejs/biome@||')
          actual=$(biome --version | awk '{print $2}')
          echo "deno.json: $expected, installed: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error file=biome.json::Biome $actual (from biome.json \$schema) does not match $expected in deno.json"
            exit 1
          fi

      # `biome ci` emits GitHub annotations automatically. With the formatter
      # and assist disabled in biome.json, it only lints.
      - name: Lint
        run: biome ci --error-on-warnings

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x
          cache: true

      - name: Format
        run: deno fmt --check

      - name: Type check
        run: deno check

      - name: Test
        run: deno task test
